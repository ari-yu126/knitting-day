services:
  postgres:
    image: postgres:16
    container_name: stitch-flow-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stitchflow
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: stitch_flow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: