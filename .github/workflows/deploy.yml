name: Build and Deploy

# main / cloud-test 브랜치에 push되면 자동으로 실행됨. Actions 탭에서 수동 실행도 가능
# (workflow_dispatch).
on:
  push:
    branches: [main, cloud-test]
  workflow_dispatch: {}

env:
  API_IMAGE: ghcr.io/ari-yu126/knitting-day-api
  WEB_IMAGE: ghcr.io/ari-yu126/knitting-day-web

jobs:
  # 1) api/web 이미지를 GitHub Actions 서버(리소스 넉넉함)에서 빌드해서 GHCR에 올림.
  #    VM에서 직접 빌드하지 않는 이유: 무료 VM은 RAM이 1GB라 Next.js 빌드 중에
  #    메모리 부족으로 죽을 수 있음.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest

      - name: web 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          # NEXT_PUBLIC_ 로 시작하는 값은 브라우저 번들에 그대로 박히기 때문에
          # 빌드 시점에 넣어줘야 함 (실행 시점에 넣어봐야 이미 늦음).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  # 2) 이미지가 준비되면 VM에 SSH로 접속해서 "받아서 재기동"만 시킴.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기 (docker-compose.prod.yml 전달용)
        uses: actions/checkout@v4

      - name: docker-compose.prod.yml을 서버로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/knitting-day"

      - name: 서버 접속 → 최신 이미지 받아서 재기동
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/knitting-day
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

# ── 내일 GitHub 저장소 Settings > Secrets and variables > Actions 에 등록해야 하는 값 ──
#
# NEXT_PUBLIC_API_URL   : http://<VM 공인 IP>:4000  (api가 실제로 열려 있는 주소)
# GCP_VM_HOST           : VM 공인 IP
# GCP_VM_USER           : VM에 SSH로 접속할 계정 이름
# GCP_VM_SSH_KEY        : 그 계정으로 접속할 SSH 개인키 (전체 내용, -----BEGIN...부터 끝까지)
# GHCR_TOKEN            : GitHub Personal Access Token (Settings > Developer settings >
#                         Personal access tokens, 권한: read:packages) — VM이 GHCR에서
#                         이미지를 받아오려면 로그인이 필요해서 사용
#
# 그리고 VM 안에는 ~/knitting-day/.env 파일을 직접 만들어서 아래 값을 채워둬야 함
# (이건 CI가 아니라 서버 준비할 때 딱 한 번 수동으로):
#   JWT_SECRET=...
#   EMAIL_USER=...
#   EMAIL_PASSWORD=...
#   SWAGGER_SERVER_URL=http://<VM 공인 IP>:4000  (Swagger UI "Try it out"이 쓸 주소)
